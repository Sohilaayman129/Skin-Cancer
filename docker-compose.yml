version: '3.8'

services:
  # ========================================================
  # Unified Grounded Clinical AI Assistant (Angular + .NET 9)
  # Provides the complete SPA UI + RAG Engine on port 5000
  # ========================================================
  grounded-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: grounded-clinical-ai:latest
    container_name: grounded_clinical_assistant
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Logging__LogLevel__Default=Information
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================================
  # Optional: Python FastAPI Backend with ChromaDB
  # (Activate with: docker compose --profile python up)
  # ========================================================
  grounded-python:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: grounded-python-backend:latest
    container_name: grounded_python_backend
    profiles:
      - python
      - all
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_PROVIDER=openrouter
      - LLM_MODEL=google/gemini-2.5-flash
    volumes:
      - ./chroma_index:/app/chroma_index
